services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUST_PROXY: "1"
      AUTO_UPDATE_YTDLP: "1"
      MAX_DURATION: "1800"
      MAX_FILESIZE_MB: "500"
      MAX_CONCURRENT: "3"
    expose:
      - "8000"
    tmpfs:
      - /tmp:size=2g

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
